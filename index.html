<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="shortcut icon" href="./images/a logo.png" type="image/x-icon">
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="circle1"></div>
  <div class="circle2"></div>

  <div class="wrapper">
    <div class="card-wrapper">
      <div>
        <img style="object-fit: cover;" src="./images/Screenshot 2025-06-20 at 5.56.26 PM.png" alt="Ayush"  />
      </div>
      <div class="user-name">
        <h2>Ayush Jaiswal</h2>
      </div>
      <div class="designation">
        <h3>Coder, Web Developer</h3>
      </div>
      <div class="bottom-group">
        <button onclick="openModal()" class="btn-share btn-card">
          <i class="fa-solid fa-share"></i>
          <div>share my profile</div>
        </button>

        <button class="btn-follow btn-card" onclick="window.open('https://github.com/AyushhhJaiswal', '_blank')">
          Follow me
        </button>        
        <div class="ayush">
          <a href="https://github.com/AyushhhJaiswal"></a>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Component -->
  <div class="modal">
    <div class="modal-header">
      <h1>Share My Profile</h1>
      <div>
        <i onclick="closeModal()" class="fa-solid fa-xmark close"></i>
      </div>
    </div>


    <div>

      <h3>Share this via</h3>

      
      <div class="icon-container">
        <a href="https://www.linkedin.com/in/ayush-jaiswal-3b088331a/" class="icon" id="twitter">
          <i class="fa-brands fa-linkedin"></i>
        </a>
        <a href="https://www.instagram.com/ayushjaiswal330?igsh=MWR3bjcxcTB1Yjgzdg%3D%3D&utm_source=qr" class="icon" id="instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="#" class="icon" id="whatsapp">
          <i class="fa-brands fa-whatsapp"></i>
        </a>
        <a href="#" class="icon" id="telegram">
          <i class="fa-brands fa-telegram"></i>
        </a>
        <a href="https://github.com/AyushhhJaiswal" class="icon" id="github">
          <i class="fa-brands fa-github"></i>
        </a>
      </div>
    </div>


  </div>

  <!-- Overlay -->
  <div class="overlay" onclick="closeModal()"></div>

  
  <script src="./script.js"></script>

  
</body>

</html>
